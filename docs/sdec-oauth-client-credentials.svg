<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 772" role="img" aria-label="OAuth 2.0 client credentials sequence for SDEC" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<rect width="940" height="772" fill="#ffffff"/>
<line x1="116" y1="74" x2="116" y2="762" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="16.0" y="18" width="200" height="56" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.4"/>
<text x="116" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">SDEC backend</text>
<text x="116" y="60" text-anchor="middle" font-size="11" fill="#52606d">Thread Manager / HTTP service</text>
<line x1="352" y1="74" x2="352" y2="762" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="252.0" y="18" width="200" height="56" rx="6" fill="#e8f0fa" stroke="#1d4e89" stroke-width="1.4"/>
<text x="352" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4e89">Authorisation server</text>
<text x="352" y="60" text-anchor="middle" font-size="11" fill="#52606d">OAuth 2.0 token endpoint</text>
<line x1="588" y1="74" x2="588" y2="762" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="488.0" y="18" width="200" height="56" rx="6" fill="#e8f0fa" stroke="#1d4e89" stroke-width="1.4"/>
<text x="588" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4e89">Boomi API Gateway</text>
<text x="588" y="60" text-anchor="middle" font-size="11" fill="#52606d">Policy enforcement point</text>
<line x1="824" y1="74" x2="824" y2="762" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="724.0" y="18" width="200" height="56" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.4"/>
<text x="824" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Boomi iPaaS / HIP</text>
<text x="824" y="60" text-anchor="middle" font-size="11" fill="#52606d">API process, MFT, NRS proxy</text>
<line x1="116" y1="146" x2="350" y2="146" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="169.5" y="104.0" width="129.0" height="16.0" fill="#ffffff"/>
<rect x="82.2" y="120.0" width="303.7" height="15.0" fill="#ffffff"/>
<text x="234.0" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933" >POST /oauth2/token</text>
<text x="234.0" y="131" text-anchor="middle" font-size="11" fill="#52606d" >client_id:secret (HTTP Basic), grant_type, scope</text>
<circle cx="102" cy="146" r="9.5" fill="#1d4e89"/>
<text x="102" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
<rect x="236.0" y="168" width="232" height="42" rx="5" fill="#fdf8e6" stroke="#c9a227" stroke-width="1.2"/>
<text x="360.0" y="185" text-anchor="middle" font-size="11.5" fill="#1f2933">Authenticate client, check</text>
<text x="360.0" y="200" text-anchor="middle" font-size="11.5" fill="#1f2933">permitted scopes, sign JWT</text>
<circle cx="249.0" cy="189" r="9.5" fill="#1d4e89"/>
<text x="249.0" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
<line x1="352" y1="274" x2="118" y2="274" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="209.8" y="232.0" width="48.3" height="16.0" fill="#ffffff"/>
<rect x="79.1" y="248.0" width="309.8" height="15.0" fill="#ffffff"/>
<text x="234.0" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933" >200 OK</text>
<text x="234.0" y="259" text-anchor="middle" font-size="11" fill="#52606d" >access_token (JWT), token_type=Bearer, expires_in</text>
<circle cx="366" cy="274" r="9.5" fill="#1d4e89"/>
<text x="366" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
<rect x="0.0" y="296" width="232" height="42" rx="5" fill="#fdf8e6" stroke="#c9a227" stroke-width="1.2"/>
<text x="124.0" y="313" text-anchor="middle" font-size="11.5" fill="#1f2933">Cache token in memory;</text>
<text x="124.0" y="328" text-anchor="middle" font-size="11.5" fill="#1f2933">renew shortly before expiry</text>
<circle cx="13.0" cy="317" r="9.5" fill="#1d4e89"/>
<text x="13.0" y="321" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
<line x1="116" y1="402" x2="586" y2="402" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="193.4" y="360.0" width="317.1" height="16.0" fill="#ffffff"/>
<rect x="212.5" y="376.0" width="279.0" height="15.0" fill="#ffffff"/>
<text x="352.0" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933" >API call: Authorization: Bearer &lt;access_token&gt;</text>
<text x="352.0" y="387" text-anchor="middle" font-size="11" fill="#52606d" >Idempotency-Key, X-Correlation-ID, JSON body</text>
<circle cx="102" cy="402" r="9.5" fill="#1d4e89"/>
<text x="102" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
<rect x="472.0" y="424" width="232" height="42" rx="5" fill="#fdf8e6" stroke="#c9a227" stroke-width="1.2"/>
<text x="596.0" y="441" text-anchor="middle" font-size="11.5" fill="#1f2933">Validate JWT: JWKS signature,</text>
<text x="596.0" y="456" text-anchor="middle" font-size="11.5" fill="#1f2933">iss, aud, exp, scope, client_id</text>
<circle cx="485.0" cy="445" r="9.5" fill="#1d4e89"/>
<text x="485.0" y="449" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
<line x1="588" y1="530" x2="822" y2="530" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="651.6" y="488.0" width="108.8" height="16.0" fill="#ffffff"/>
<rect x="603.4" y="504.0" width="205.1" height="15.0" fill="#ffffff"/>
<text x="706.0" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933" >Forward request</text>
<text x="706.0" y="515" text-anchor="middle" font-size="11" fill="#52606d" >client identity + correlation ID</text>
<circle cx="574" cy="530" r="9.5" fill="#1d4e89"/>
<text x="574" y="534" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text>
<line x1="824" y1="594" x2="590" y2="594" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="675.1" y="552.0" width="61.8" height="16.0" fill="#ffffff"/>
<rect x="621.9" y="568.0" width="168.2" height="15.0" fill="#ffffff"/>
<text x="706.0" y="564" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933" >Response</text>
<text x="706.0" y="579" text-anchor="middle" font-size="11" fill="#52606d" >201 / 200 / 202 or Problem</text>
<circle cx="838" cy="594" r="9.5" fill="#1d4e89"/>
<text x="838" y="598" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text>
<line x1="588" y1="658" x2="118" y2="658" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="294.2" y="616.0" width="115.5" height="16.0" fill="#ffffff"/>
<rect x="209.4" y="632.0" width="285.2" height="15.0" fill="#ffffff"/>
<text x="352.0" y="628" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933" >Response to SDEC</text>
<text x="352.0" y="643" text-anchor="middle" font-size="11" fill="#52606d" >or 401 invalid_token / 403 insufficient_scope</text>
<circle cx="602" cy="658" r="9.5" fill="#1d4e89"/>
<text x="602" y="662" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">9</text>
<rect x="16" y="684" width="672" height="62" fill="none" stroke="#b3401a" stroke-width="1.3" stroke-dasharray="4 3"/>
<path d="M16,684 h150 v14 l-10,10 h-140 z" fill="#fcebe5" stroke="#b3401a" stroke-width="1.3"/>
<text x="24" y="700" font-size="11.5" font-weight="700" fill="#b3401a">alt  401 invalid_token</text>
<rect x="45.3" y="718.5" width="613.4" height="15.5" fill="#ffffff"/>
<text x="352.0" y="730" text-anchor="middle" font-size="11.5" fill="#1f2933" >Discard cached token, request a new one once (step 1), then retry the call. 403: do not retry.</text>
</svg>