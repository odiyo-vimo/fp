<text x="360" y="316" font-size="15" font-weight="700" fill="#7b2d6e">Organization: TAX-PRJ-&lt;Product&gt; (one product team)</text>
<rect x="100" y="380" width="280" height="110" rx="8" fill="#ffffff" stroke="#2b3a8c" stroke-width="1.8"/>
<rect x="520" y="380" width="280" height="110" rx="8" fill="#ffffff" stroke="#2b3a8c" stroke-width="1.8"/>
<rect x="960" y="350" width="260" height="100" rx="8" fill="#ffffff" stroke="#2b3a8c" stroke-width="1.8"/>
