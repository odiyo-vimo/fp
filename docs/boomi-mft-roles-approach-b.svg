<polyline points="380,435 520,435" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#boomi-a)"/>
<polyline points="800,420 850,420 850,400 960,400" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#boomi-a)"/>
<polyline points="800,450 850,450 850,540 960,540" fill="none" stroke="#3e4c59" stroke-width="2" marker-end="url(#boomi-a)"/>
<text x="280.0" y="74" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">iPaaS platform team</text>
<text x="280.0" y="100" font-size="13.5" text-anchor="middle" fill="#3e4c59">Creates organizations, assigns roles</text>
<text x="280.0" y="120" font-size="13.5" text-anchor="middle" fill="#3e4c59">Registers MFT runtimes (D-RA-01)</text>
<text x="280.0" y="140" font-size="13.5" text-anchor="middle" fill="#3e4c59">Grants cross-organization access</text>
<text x="1060.0" y="84" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Approach B</text>
<text x="1060.0" y="110" font-size="13.5" text-anchor="middle" fill="#3e4c59">Each product team gets one organization per instance and environment.</text>
<text x="1060.0" y="130" font-size="13.5" text-anchor="middle" fill="#3e4c59">Inside it the team creates its own endpoints and flows. It cannot create organizations.</text>
<text x="240.0" y="409" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Source A</text>
<text x="240.0" y="435" font-size="13.5" text-anchor="middle" fill="#3e4c59">SFTP site (external)</text>
<text x="240.0" y="455" font-size="13.5" text-anchor="middle" fill="#3e4c59">Organization endpoint</text>
<text x="240.0" y="475" font-size="13.5" text-anchor="middle" fill="#3e4c59">Created by Standard_Admin</text>
<text x="660.0" y="409" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">iPaaS S3 staging area</text>
<text x="660.0" y="435" font-size="13.5" text-anchor="middle" fill="#3e4c59">S3, internal via MFT Node</text>
<text x="660.0" y="455" font-size="13.5" text-anchor="middle" fill="#3e4c59">Organization endpoint</text>
<text x="660.0" y="475" font-size="13.5" text-anchor="middle" fill="#3e4c59">Created by Standard_Admin</text>
<text x="1090.0" y="384" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Destination A</text>
<text x="1090.0" y="410" font-size="13.5" text-anchor="middle" fill="#3e4c59">Organization endpoint</text>
<text x="1090.0" y="430" font-size="13.5" text-anchor="middle" fill="#3e4c59">Created by Standard_Admin</text>
<text x="1090.0" y="524" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Destination B</text>
<text x="1090.0" y="550" font-size="13.5" text-anchor="middle" fill="#3e4c59">Organization endpoint</text>
<text x="1090.0" y="570" font-size="13.5" text-anchor="middle" fill="#3e4c59">Created by Standard_Admin</text>
<text x="1390.0" y="384" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Keys and certificates</text>
<text x="1390.0" y="410" font-size="13.5" text-anchor="middle" fill="#3e4c59">PGP, SSH, TLS</text>
<text x="1390.0" y="430" font-size="13.5" text-anchor="middle" fill="#3e4c59">Standard_Admin (D-RA-02)</text>
<text x="1390.0" y="524" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Alerts and activity</text>
<text x="1390.0" y="550" font-size="13.5" text-anchor="middle" fill="#3e4c59">File activity and alerts</text>
<text x="1390.0" y="570" font-size="13.5" text-anchor="middle" fill="#3e4c59">Both roles view and act</text>
<text x="660.0" y="631" font-size="13.5" font-style="italic" text-anchor="middle" fill="#3e4c59">Flows 1 to 3 and their flow endpoints are created by Standard_User, using the organization&#x27;s endpoints</text>
<text x="310.0" y="714" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Standard_Admin (administrator)</text>
<text x="310.0" y="740" font-size="13.5" text-anchor="middle" fill="#3e4c59">Product or project lead or owner</text>
<text x="310.0" y="760" font-size="13.5" text-anchor="middle" fill="#3e4c59">Creates and maintains organization endpoints</text>
<text x="310.0" y="780" font-size="13.5" text-anchor="middle" fill="#3e4c59">Everything Standard_User can do</text>
<text x="770.0" y="714" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Standard_User (developer)</text>
<text x="770.0" y="740" font-size="13.5" text-anchor="middle" fill="#3e4c59">Developers in the product team</text>
<text x="770.0" y="760" font-size="13.5" text-anchor="middle" fill="#3e4c59">Creates flows using organization endpoints</text>
<text x="770.0" y="780" font-size="13.5" text-anchor="middle" fill="#3e4c59">Views alerts and file activity</text>
<text x="1270.0" y="714" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Machine user (service account)</text>
<text x="1270.0" y="740" font-size="13.5" text-anchor="middle" fill="#3e4c59">Not a person; one per integration</text>
<text x="1270.0" y="760" font-size="13.5" text-anchor="middle" fill="#3e4c59">Triggers flows and uploads files</text>
<text x="1270.0" y="780" font-size="13.5" text-anchor="middle" fill="#3e4c59">Requests pre-signed URLs through the API</text>
<text x="800.0" y="899" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Other organizations in this instance</text>
<text x="800.0" y="925" font-size="13.5" text-anchor="middle" fill="#3e4c59">No access unless the iPaaS team grants it on a need basis (D-RA-04)</text>
<rect x="292" y="232" width="261" height="26" rx="13" fill="#ffffff" stroke="#9aa5b1"/>
<text x="423" y="250" font-size="13" text-anchor="middle" fill="#1f2933">Creates organization, assigns roles</text>
<rect x="419" y="422" width="61" height="26" rx="13" fill="#ffffff" stroke="#9aa5b1"/>
<text x="450" y="440" font-size="13" text-anchor="middle" fill="#1f2933">Flow 1</text>
<rect x="871" y="387" width="61" height="26" rx="13" fill="#ffffff" stroke="#9aa5b1"/>
<text x="902" y="405" font-size="13" text-anchor="middle" fill="#1f2933">Flow 2</text>
<rect x="871" y="527" width="61" height="26" rx="13" fill="#ffffff" stroke="#9aa5b1"/>
<text x="902" y="545" font-size="13" text-anchor="middle" fill="#1f2933">Flow 3</text>
<rect x="40" y="985" width="1520" height="70" rx="10" fill="#f7f8fa" stroke="#c5ccd3"/>
<rect x="64" y="1001" width="26" height="18" rx="4" fill="#ffffff" stroke="#2b3a8c" stroke-width="1.8"/>
<text x="100" y="1015" font-size="14" fill="#1f2933">Organization endpoint</text>
<rect x="299.82000000000005" y="1001" width="26" height="18" rx="4" fill="#e8f0fa" stroke="#1d4e89" stroke-width="1.8"/>
<text x="335.82000000000005" y="1015" font-size="14" fill="#1f2933">Role or account</text>
<rect x="491.12000000000006" y="1001" width="26" height="18" rx="4" fill="#fdf3d6" stroke="#7a5a00" stroke-width="1.8"/>
<text x="527.1200000000001" y="1015" font-size="14" fill="#1f2933">Platform team</text>
<text x="64" y="1043" font-size="13" fill="#52606d">Arrows inside the organization are flows. Endpoint, flow and account names follow the naming conventions in section 8.</text>
</svg>