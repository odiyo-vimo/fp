<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1070" width="1600" height="1070" font-family="Segoe UI, Calibri, Arial, sans-serif" role="img" aria-label="Boomi MFT roles, Approach B">
<defs><marker id="boomi-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker></defs>
