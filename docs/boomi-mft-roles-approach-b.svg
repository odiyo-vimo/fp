<rect x="1260" y="350" width="260" height="100" rx="8" fill="#ffffff" stroke="#2b3a8c" stroke-width="1.8"/>
<rect x="1260" y="490" width="260" height="100" rx="8" fill="#ffffff" stroke="#2b3a8c" stroke-width="1.8"/>
<rect x="100" y="665" width="420" height="150" rx="8" fill="#e8f0fa" stroke="#1d4e89" stroke-width="1.8"/>
