<rect x="210.2" y="341.2" width="249.6" height="19" rx="9" fill="#ffffff" stroke="#2e6ca4" stroke-width="0.8" opacity="0.96"/>
<text x="335.0" y="355.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2e6ca4">4  Download via link  (HTTPS/TLS)</text>
<line x1="951.4" y1="440.0" x2="623.6" y2="610.0" stroke="#233" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aMain)"/>
