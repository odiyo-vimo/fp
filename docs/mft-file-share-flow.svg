<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Segoe UI,Arial,sans-serif">
<rect x="0" y="0" width="1240" height="800" fill="#f6f8fb"/>
<defs><marker id="aMain" markerWidth="11" markerHeight="11" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#233"/></marker></defs>
<defs><marker id="aUp" markerWidth="11" markerHeight="11" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d7a4d"/></marker></defs>
<defs><marker id="aDn" markerWidth="11" markerHeight="11" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e6ca4"/></marker></defs>
<defs><marker id="aLink" markerWidth="11" markerHeight="11" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker></defs>
<text x="620.0" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#12123A">Boomi MFT File Sharing (FS): citizen upload / download &amp; agent dynamic links</text>
<text x="620.0" y="66" text-anchor="middle" font-size="13" fill="#5b6b7d">Ad-hoc, person-driven capability. Distinct from Automated File Transfer (AFT).</text>
<rect x="40" y="250" width="250" height="250" rx="12" fill="#fbf1ee" stroke="#E24A2E" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="54" y="272" font-size="12.5" font-weight="700" fill="#E24A2E" letter-spacing="0.4">EXTERNAL: Citizens / Customers</text>
<rect x="360" y="95" width="500" height="640" rx="12" fill="#eaf1f8" stroke="#2e6ca4" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="374" y="117" font-size="12.5" font-weight="700" fill="#2e6ca4" letter-spacing="0.4">BOOMI MFT File Sharing (FS)  ·  cloud</text>
