<text x="366.1" y="268.3" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d7a4d">1  Upload  (HTTPS/TLS)</text>
<line x1="560.0" y1="224.0" x2="560.0" y2="300.0" stroke="#233" stroke-width="2" marker-end="url(#aMain)"/>
<rect x="524.8" y="251.0" width="98.4" height="19" rx="9" fill="#ffffff" stroke="#233" stroke-width="0.8" opacity="0.96"/>
