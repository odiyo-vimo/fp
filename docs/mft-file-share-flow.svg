<text x="1057.5" y="377.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#233">Agent (account holder)</text>
<text x="1057.5" y="394.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#233">Manages files · creates links</text>
<text x="40" y="758" font-size="11.5" font-weight="700" fill="#12123A">Flow:</text>
<line x1="88" y1="754" x2="110" y2="754" stroke="#1d7a4d" stroke-width="3"/>
<text x="116" y="758" font-size="11.5" fill="#233">1 Citizen uploads (Dropbox link)</text>
<line x1="346.0" y1="754" x2="368.0" y2="754" stroke="#8a5a00" stroke-width="3"/>
<text x="374.0" y="758" font-size="11.5" fill="#233">2 Agent creates dynamic link</text>
<line x1="576.0" y1="754" x2="598.0" y2="754" stroke="#8a5a00" stroke-width="3"/>
<text x="604.0" y="758" font-size="11.5" fill="#233">3 Link delivered to citizen</text>
<line x1="799.0" y1="754" x2="821.0" y2="754" stroke="#2e6ca4" stroke-width="3"/>
<text x="827.0" y="758" font-size="11.5" fill="#233">4 Citizen downloads via link</text>
</svg>