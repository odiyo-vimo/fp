<text x="560.0" y="179.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#233">MFT Dropbox™</text>
<text x="560.0" y="196.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#233">Inbound upload link · no account needed</text>
<rect x="410" y="300" width="300" height="96" rx="9" fill="#12123A" stroke="#12123A" stroke-width="2"/>
<text x="560.0" y="340.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">File Share store</text>
<text x="560.0" y="357.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffffff">Encrypted at rest · AV scan · full audit log</text>
<rect x="410" y="470" width="300" height="74" rx="9" fill="#fbf5e8" stroke="#8a5a00" stroke-width="2"/>
<text x="560.0" y="499.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#233">Dynamic Link service</text>
<text x="560.0" y="516.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#233">Time-limited · optional password</text>
<rect x="410" y="610" width="300" height="66" rx="9" fill="#ffffff" stroke="#2e6ca4" stroke-width="2"/>
<text x="560.0" y="635.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#233">MFT Web Portal + Add-ins</text>
<text x="560.0" y="652.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#233">(Outlook · Salesforce · Office 365)</text>
