openapi: 3.0.3
info:
  title: MFT Presigned Upload and Delete APIs
  version: 1.0.0-draft
  description: IDD-FT-002 v0.1 (draft). Presigned uploads to the Boomi MFT SFTP server and delete by external document ID.
servers:
- url: https://api.hip.example/file-transfer/v1
paths:
  /generate_presignedurl:
    post:
      operationId: generatePresignedUrl
      summary: Generate presigned URL
      security:
      - oauth2:
        - file-transfer.upload.request
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
            example:
              correlationId: 6f1c2b4e-8d0a-4b8e-9f3a-2c7d5e1a9b40
              sourceSystem: SDEC-FE
              businessReference: THR-2026-004512
              documents:
              - externalDocumentId: DOC-1001
                documentName: bank-statement-march-2026.pdf
                fileSizeBytes: 2483011
                mimeType: application/pdf
                checksumSha256: yvQRE13JUl2vqF8HHg/Y1yGKHuHAnWY5KHxmPNIS9HA=
                documentType: EVIDENCE
              - externalDocumentId: DOC-1002
                documentName: tenancy-agreement-signed.pdf
                fileSizeBytes: 8817406
                mimeType: application/pdf
                checksumSha256: eF9ICNK9bGbqcYPRNIFRHxog9C+TMqnvbooft/Vq/KY=
                documentType: EVIDENCE
              - externalDocumentId: DOC-1003
                documentName: property-survey-scans.tiff
                fileSizeBytes: 157286400
                mimeType: image/tiff
                checksumSha256: R6lPoNCGHyghiNLido+ZRHUI1kzURpYlfie03uwmWDE=
                documentType: EVIDENCE
      responses:
        '201':
          description: URLs issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
              example:
                fileCollectionId: fc-3e8a1d9c-5b27-4f60-a2c4-7d19e0b6f851
                correlationId: 6f1c2b4e-8d0a-4b8e-9f3a-2c7d5e1a9b40
                status: PENDING_UPLOAD
                createdAt: '2026-10-03T10:15:00Z'
                expiresAt: '2026-10-03T10:30:00Z'
                acceptedCount: 2
                rejectedCount: 1
                files:
                - externalDocumentId: DOC-1001
                  fileId: f-9a1e4c7b-2d58-4e03-b6f1-0c3a8d27e5b9
                  status: URL_ISSUED
                  upload:
                    method: PUT
                    url: https://api.hip.example/file-transfer/v1/uploads/f-9a1e4c7b-2d58-4e03-b6f1-0c3a8d27e5b9?expires=1791023400&kid=k2026-10&sig=LQ27W7b1DxpYxXndoKdAjPLVAx_zC0wqIm0sz-Tfmgo
                    expiresAt: '2026-10-03T10:30:00Z'
                    requiredHeaders:
                      X-External-Document-ID: DOC-1001
                      Content-Type: application/pdf
                      Content-Length: '2483011'
                      Content-Digest: 'sha-256=:yvQRE13JUl2vqF8HHg/Y1yGKHuHAnWY5KHxmPNIS9HA=:'
                - externalDocumentId: DOC-1002
                  fileId: f-41c7e2d0-8b39-4a65-9e12-d5f0a3b7c846
                  status: URL_ISSUED
                  upload:
                    method: PUT
                    url: https://api.hip.example/file-transfer/v1/uploads/f-41c7e2d0-8b39-4a65-9e12-d5f0a3b7c846?expires=1791023400&kid=k2026-10&sig=8osB6ObkhVUmrR1Fm3-yogqhs_u9UPLWDB5drJGvS8Q
                    expiresAt: '2026-10-03T10:30:00Z'
                    requiredHeaders:
                      X-External-Document-ID: DOC-1002
                      Content-Type: application/pdf
                      Content-Length: '8817406'
                      Content-Digest: 'sha-256=:eF9ICNK9bGbqcYPRNIFRHxog9C+TMqnvbooft/Vq/KY=:'
                - externalDocumentId: DOC-1003
                  status: REJECTED
                  rejection:
                    code: FILE_TOO_LARGE
                    detail: 157286400 bytes exceeds the policy limit of 104857600 bytes for SDEC-FE/EVIDENCE.
        '400':
          description: 'INVALID_REQUEST: Schema failure, duplicate externalDocumentId in the request, or correlation id mismatch.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 'UNAUTHENTICATED: Missing or invalid token.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'SOURCE_SYSTEM_NOT_PERMITTED: Client not registered for sourceSystem or missing scope.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'IDEMPOTENCY_KEY_REUSED: Same key, different body.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.hip.example/problems/external-id-in-use
                title: externalDocumentId already has a live file
                status: 409
                code: EXTERNAL_ID_IN_USE
                detail: DOC-1001 already has a file in state AVAILABLE for SDEC-FE (fileId f-9a1e4c7b-...). Delete it first or use a new externalDocumentId.
                correlationId: 6f1c2b4e-8d0a-4b8e-9f3a-2c7d5e1a9b40
        '422':
          description: 'TOO_MANY_DOCUMENTS / NO_DOCUMENTS_ACCEPTED: More than 10 documents, or every document rejected.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'RATE_LIMITED: Quota exceeded; Retry-After returned.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 'INTERNAL_ERROR / DEPENDENCY_UNAVAILABLE: Nothing committed.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'INTERNAL_ERROR / DEPENDENCY_UNAVAILABLE: Nothing committed.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /uploads/{fileId}:
    put:
      operationId: uploadToPresignedUrl
      summary: Upload to the presigned URL
      security: []
      description: Presigned URL. No OAuth. X-External-Document-ID is mandatory and must match the document the URL was issued for.
      parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
      - name: expires
        in: query
        required: true
        schema:
          type: integer
      - name: kid
        in: query
        required: true
        schema:
          type: string
      - name: sig
        in: query
        required: true
        schema:
          type: string
      - name: X-External-Document-ID
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,64}$
      - name: Content-Digest
        in: header
        required: true
        schema:
          type: string
          pattern: ^sha-256=:[A-Za-z0-9+/]{43}=:$
      - name: Content-Length
        in: header
        required: true
        schema:
          type: integer
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Written to MFT /inbound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              example:
                fileId: f-9a1e4c7b-2d58-4e03-b6f1-0c3a8d27e5b9
                externalDocumentId: DOC-1001
                fileCollectionId: fc-3e8a1d9c-5b27-4f60-a2c4-7d19e0b6f851
                correlationId: 6f1c2b4e-8d0a-4b8e-9f3a-2c7d5e1a9b40
                status: UPLOADED
                receivedBytes: 2483011
                checksumSha256: yvQRE13JUl2vqF8HHg/Y1yGKHuHAnWY5KHxmPNIS9HA=
                receivedAt: '2026-10-03T10:17:12Z'
        '400':
          description: 'DOCUMENT_ID_MISSING / DOCUMENT_ID_MISMATCH: Header absent, or not the document this URL was issued for.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.hip.example/problems/document-id-mismatch
                title: Document ID does not match this URL
                status: 400
                code: DOCUMENT_ID_MISMATCH
                detail: X-External-Document-ID DOC-1002 does not match the document this URL was issued for.
                correlationId: 6f1c2b4e-8d0a-4b8e-9f3a-2c7d5e1a9b40
        '403':
          description: 'SIGNATURE_INVALID: URL altered or signed with an unknown key.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'URL_ALREADY_USED: The URL has already been used.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: 'URL_EXPIRED / URL_REVOKED: Expired, or the file was deleted through API 3.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.hip.example/problems/url-expired
                title: Upload URL has expired
                status: 410
                code: URL_EXPIRED
                detail: The URL expired at 2026-10-03T10:30:00Z. Call POST /generate_presignedurl again.
                correlationId: 6f1c2b4e-8d0a-4b8e-9f3a-2c7d5e1a9b40
        '413':
          description: 'PAYLOAD_TOO_LARGE: Body above the gateway limit.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'CHECKSUM_MISMATCH: Received bytes do not match the signed SHA-256.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 'MFT_WRITE_FAILED: SFTP write to MFT failed; state reset.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /delete_file:
    post:
      operationId: deleteFile
      summary: Delete a file
      security:
      - oauth2:
        - file-transfer.file.delete
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
            example:
              correlationId: c9e2a7d4-5b13-4f8e-a6c0-1d7f3b9e2a58
              sourceSystem: SDEC-FE
              externalDocumentId: DOC-1001
              documentName: bank-statement-march-2026.pdf
              fileSizeBytes: 2483011
              reason: Uploaded against the wrong thread
      responses:
        '200':
          description: DELETED or ALREADY_REMOVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
              example:
                externalDocumentId: DOC-1001
                fileId: f-9a1e4c7b-2d58-4e03-b6f1-0c3a8d27e5b9
                correlationId: c9e2a7d4-5b13-4f8e-a6c0-1d7f3b9e2a58
                outcome: DELETED
                previousStatus: AVAILABLE
                deletedAt: '2026-10-03T11:02:44Z'
        '202':
          description: DELETE_PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
              example:
                externalDocumentId: DOC-1002
                fileId: f-41c7e2d0-8b39-4a65-9e12-d5f0a3b7c846
                correlationId: c9e2a7d4-5b13-4f8e-a6c0-1d7f3b9e2a58
                outcome: DELETE_PENDING
                previousStatus: UPLOADED
                detail: The file is being scanned by MFT. It will be deleted as soon as the scan finishes; a file_deleted event confirms it.
        '400':
          description: 'INVALID_REQUEST: Schema failure or correlation id mismatch.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 'UNAUTHENTICATED: Missing or invalid token.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'SOURCE_SYSTEM_NOT_PERMITTED: sourceSystem not registered to the client.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'FILE_NOT_FOUND: No record for sourceSystem and externalDocumentId.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'DOCUMENT_MISMATCH: documentName or fileSizeBytes differ from the record; nothing deleted.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.hip.example/problems/document-mismatch
                title: Document details do not match the file on record
                status: 409
                code: DOCUMENT_MISMATCH
                detail: fileSizeBytes 2483000 does not match the recorded size for DOC-1001. Nothing was deleted.
                correlationId: c9e2a7d4-5b13-4f8e-a6c0-1d7f3b9e2a58
                errors:
                - pointer: /fileSizeBytes
                  message: Recorded value differs
        '429':
          description: 'RATE_LIMITED: Quota exceeded.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 'MFT_DELETE_FAILED: SFTP delete failed; state unchanged.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.hip.example/oauth2/token
          scopes:
            file-transfer.upload.request: Generate upload URLs
            file-transfer.file.delete: Delete files
  schemas:
    GenerateRequest:
      type: object
      additionalProperties: false
      required:
      - correlationId
      - sourceSystem
      - documents
      properties:
        correlationId:
          type: string
          format: uuid
        sourceSystem:
          type: string
          pattern: ^[A-Z0-9-]{3,20}$
        businessReference:
          type: string
          maxLength: 64
        documents:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/DocumentRequest'
    DocumentRequest:
      type: object
      additionalProperties: false
      required:
      - externalDocumentId
      - documentName
      - fileSizeBytes
      - mimeType
      - checksumSha256
      properties:
        externalDocumentId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,64}$
        documentName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[^/\\]+$
        fileSizeBytes:
          type: integer
          minimum: 1
        mimeType:
          type: string
        checksumSha256:
          type: string
          pattern: ^[A-Za-z0-9+/]{43}=$
        documentType:
          type: string
          pattern: ^[A-Z0-9_]{2,30}$
    UploadInstruction:
      type: object
      required:
      - method
      - url
      - expiresAt
      - requiredHeaders
      properties:
        method:
          type: string
          enum:
          - PUT
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        requiredHeaders:
          type: object
          required:
          - X-External-Document-ID
          - Content-Digest
          additionalProperties:
            type: string
    FileResult:
      type: object
      required:
      - externalDocumentId
      - status
      properties:
        externalDocumentId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,64}$
        fileId:
          type: string
        status:
          type: string
          enum:
          - URL_ISSUED
          - REJECTED
        upload:
          $ref: '#/components/schemas/UploadInstruction'
        rejection:
          type: object
          required:
          - code
          - detail
          properties:
            code:
              type: string
              enum:
              - FILE_TOO_LARGE
              - FILE_EMPTY
              - MIME_TYPE_NOT_ALLOWED
              - NAME_INVALID
            detail:
              type: string
    GenerateResponse:
      type: object
      required:
      - fileCollectionId
      - correlationId
      - status
      - createdAt
      - expiresAt
      - acceptedCount
      - rejectedCount
      - files
      properties:
        fileCollectionId:
          type: string
        correlationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING_UPLOAD
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedCount:
          type: integer
        rejectedCount:
          type: integer
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileResult'
    UploadResponse:
      type: object
      required:
      - fileId
      - externalDocumentId
      - status
      - receivedBytes
      - checksumSha256
      properties:
        fileId:
          type: string
        externalDocumentId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,64}$
        fileCollectionId:
          type: string
        correlationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - UPLOADED
        receivedBytes:
          type: integer
        checksumSha256:
          type: string
          pattern: ^[A-Za-z0-9+/]{43}=$
        receivedAt:
          type: string
          format: date-time
    DeleteRequest:
      type: object
      additionalProperties: false
      required:
      - correlationId
      - sourceSystem
      - externalDocumentId
      - documentName
      - fileSizeBytes
      properties:
        correlationId:
          type: string
          format: uuid
        sourceSystem:
          type: string
          pattern: ^[A-Z0-9-]{3,20}$
        externalDocumentId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,64}$
        documentName:
          type: string
          maxLength: 255
        fileSizeBytes:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 256
    DeleteResponse:
      type: object
      required:
      - externalDocumentId
      - correlationId
      - outcome
      - previousStatus
      properties:
        externalDocumentId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,64}$
        fileId:
          type: string
        correlationId:
          type: string
          format: uuid
        outcome:
          type: string
          enum:
          - DELETED
          - DELETE_PENDING
          - ALREADY_REMOVED
        previousStatus:
          type: string
          enum:
          - URL_ISSUED
          - UPLOADING
          - UPLOADED
          - AVAILABLE
          - QUARANTINED
          - DELETE_PENDING
          - DELETED
          - EXPIRED
          - REJECTED
        deletedAt:
          type: string
          format: date-time
        detail:
          type: string
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
              message:
                type: string
