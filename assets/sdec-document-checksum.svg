<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1889" role="img" aria-label="Document checksum sequence between SDEC Browser, SDEC Backend, iPaaS and NRS" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="fa" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#333"/></marker><marker id="oa" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#333" stroke-width="1.3"/></marker></defs>
<rect width="1300" height="1889" fill="#ffffff"/>
<rect x="40" y="110" width="1220" height="764" fill="none" stroke="#c9a879" stroke-width="1.3"/>
<path d="M40,110 h220 v30 l-12,12 h-208 z" fill="#fff2cc" stroke="#c9a879" stroke-width="1.3"/>
<text x="144.0" y="127.5" text-anchor="middle" font-size="12.5" fill="#5c4a1e">Integration Flow -</text>
<text x="144.0" y="142.5" text-anchor="middle" font-size="12.5" fill="#5c4a1e">Checksum match</text>
<rect x="40" y="892" width="1220" height="491" fill="none" stroke="#c9a879" stroke-width="1.3"/>
<path d="M40,892 h220 v30 l-12,12 h-208 z" fill="#fff2cc" stroke="#c9a879" stroke-width="1.3"/>
<text x="144.0" y="909.5" text-anchor="middle" font-size="12.5" fill="#5c4a1e">Integration Flow -</text>
<text x="144.0" y="924.5" text-anchor="middle" font-size="12.5" fill="#5c4a1e">Checksum mismatch</text>
<rect x="80" y="1126" width="820" height="229" fill="none" stroke="#b85450" stroke-width="1.3"/>
<path d="M80,1126 h92 v15 l-12,12 h-80 z" fill="#f8cecc" stroke="#b85450" stroke-width="1.3"/>
<text x="120.0" y="1143.5" text-anchor="middle" font-size="12.5" fill="#7a2b28">Re-try</text>
<rect x="40" y="1401" width="1220" height="454" fill="none" stroke="#c9a879" stroke-width="1.3"/>
<path d="M40,1401 h220 v30 l-12,12 h-208 z" fill="#fff2cc" stroke="#c9a879" stroke-width="1.3"/>
<text x="144.0" y="1418.5" text-anchor="middle" font-size="12.5" fill="#5c4a1e">Integration Flow -</text>
<text x="144.0" y="1433.5" text-anchor="middle" font-size="12.5" fill="#5c4a1e">Onward transfer to NRS</text>
<line x1="150" y1="80" x2="150" y2="1881" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="65" y="24" width="170" height="56" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.3"/>
<text x="150" y="57.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">SDEC Browser</text>
<line x1="450" y1="80" x2="450" y2="1881" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="365" y="24" width="170" height="56" fill="#f9dcc4" stroke="#d99a62" stroke-width="1.3"/>
<text x="450" y="57.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">SDEC Backend</text>
<line x1="760" y1="80" x2="760" y2="1881" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="675" y="24" width="170" height="56" fill="#c9d6e2" stroke="#7f98ad" stroke-width="1.3"/>
<text x="760" y="57.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">iPaaS</text>
<line x1="1050" y1="80" x2="1050" y2="1881" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="965" y="24" width="170" height="56" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
<text x="1050" y="57.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">NRS</text>
<path d="M150,172 H180 V210 H152" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="190" y="178" font-size="12" fill="#1f2933">1. Read the file in chunks and</text>
<text x="190" y="194" font-size="12" fill="#1f2933">compute SHA-256 (streaming)</text>
<rect x="175.75" y="231" width="248.5" height="19" fill="#ffffff"/>
<line x1="150" y1="256" x2="450" y2="256" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="300.0" y="244" text-anchor="middle" font-size="12" fill="#1f2933">2. Document metadata + checksumSha256</text>
<rect x="487.25" y="279" width="235.5" height="35" fill="#ffffff"/>
<line x1="450" y1="320" x2="760" y2="320" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="605.0" y="292" text-anchor="middle" font-size="12" fill="#1f2933">3. POST /generate_presignedurl with</text>
<text x="605.0" y="308" text-anchor="middle" font-size="12" fill="#1f2933">documents[].checksumSha256</text>
<path d="M760,350 H790 V404 H762" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="800" y="356" font-size="12" fill="#1f2933">4. Register fileId, store expected</text>
<text x="800" y="372" font-size="12" fill="#1f2933">digest, sign URL bound to fileId,</text>
<text x="800" y="388" font-size="12" fill="#1f2933">size and digest</text>
<rect x="471.0" y="425" width="268.0" height="35" fill="#ffffff"/>
<line x1="760" y1="466" x2="450" y2="466" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#oa)"/>
<text x="605.0" y="438" text-anchor="middle" font-size="12" fill="#1f2933">5. 201 upload.url + requiredHeaders</text>
<text x="605.0" y="454" text-anchor="middle" font-size="12" fill="#1f2933">(Content-Digest, X-External-Document-ID)</text>
<rect x="185.5" y="489" width="229.0" height="19" fill="#ffffff"/>
<line x1="450" y1="514" x2="150" y2="514" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#oa)"/>
<text x="300.0" y="502" text-anchor="middle" font-size="12" fill="#1f2933">6. Presigned URL and header values</text>
<rect x="243.0" y="537" width="424.0" height="19" fill="#ffffff"/>
<line x1="150" y1="562" x2="760" y2="562" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="455.0" y="550" text-anchor="middle" font-size="12" fill="#1f2933">7. PUT /uploads/{fileId} with Content-Digest: sha-256=:&lt;Base64&gt;:</text>
<path d="M760,592 H790 V646 H762" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="800" y="598" font-size="12" fill="#1f2933">8. Verify URL signature; header</text>
<text x="800" y="614" font-size="12" fill="#1f2933">digest must equal the registered</text>
<text x="800" y="630" font-size="12" fill="#1f2933">digest</text>
<path d="M760,674 H790 V712 H762" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="800" y="680" font-size="12" fill="#1f2933">9. Stream bytes to /inbound and hash</text>
<text x="800" y="696" font-size="12" fill="#1f2933">while writing</text>
<path d="M760,740 H790 V794 H762" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="800" y="746" font-size="12" fill="#1f2933">10. Computed = expected: status</text>
<text x="800" y="762" font-size="12" fill="#1f2933">UPLOADED, event</text>
<text x="800" y="778" font-size="12" fill="#1f2933">file_upload_received, start AV scan</text>
<rect x="324.25" y="815" width="261.5" height="19" fill="#ffffff"/>
<line x1="760" y1="840" x2="150" y2="840" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#oa)"/>
<text x="455.0" y="828" text-anchor="middle" font-size="12" fill="#1f2933">11. 201 Created (bytes received intact)</text>
<rect x="239.75" y="947" width="430.5" height="19" fill="#ffffff"/>
<line x1="150" y1="972" x2="760" y2="972" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="455.0" y="960" text-anchor="middle" font-size="12" fill="#1f2933">12. PUT /uploads/{fileId} (bytes altered or truncated on the way)</text>
<path d="M760,1002 H790 V1056 H762" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="800" y="1008" font-size="12" fill="#1f2933">13. Computed differs from expected:</text>
<text x="800" y="1024" font-size="12" fill="#1f2933">discard file, never released</text>
<text x="800" y="1040" font-size="12" fill="#1f2933">downstream</text>
<rect x="321.0" y="1077" width="268.0" height="19" fill="#ffffff"/>
<line x1="760" y1="1102" x2="150" y2="1102" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#oa)"/>
<text x="455.0" y="1090" text-anchor="middle" font-size="12" fill="#1f2933">14. 422 Problem: Content-Digest mismatch</text>
<path d="M150,1173 H180 V1227 H152" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="190" y="1179" font-size="12" fill="#1f2933">15. Recompute SHA-256. If it differs</text>
<text x="190" y="1195" font-size="12" fill="#1f2933">from step 2, the file changed:</text>
<text x="190" y="1211" font-size="12" fill="#1f2933">request a new URL</text>
<rect x="285.25" y="1248" width="339.5" height="19" fill="#ffffff"/>
<line x1="150" y1="1273" x2="760" y2="1273" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="455.0" y="1261" text-anchor="middle" font-size="12" fill="#1f2933">16. PUT again with the same URL (while not expired)</text>
<rect x="272.25" y="1296" width="365.5" height="19" fill="#ffffff"/>
<line x1="760" y1="1321" x2="150" y2="1321" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#oa)"/>
<text x="455.0" y="1309" text-anchor="middle" font-size="12" fill="#1f2933">17. 201 Created, or 410 URL_EXPIRED (request a new URL)</text>
<rect x="512.0" y="1456" width="476.0" height="19" fill="#ffffff"/>
<line x1="450" y1="1481" x2="1050" y2="1481" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="750.0" y="1469" text-anchor="middle" font-size="12" fill="#1f2933">18. NRS attachment request via iPaaS proxy, with the same checksumSha256</text>
<rect x="655.0" y="1504" width="190.0" height="19" fill="#ffffff"/>
<line x1="1050" y1="1529" x2="450" y2="1529" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#oa)"/>
<text x="750.0" y="1517" text-anchor="middle" font-size="12" fill="#1f2933">19. NRS presigned upload URL</text>
<path d="M760,1559 H790 V1613 H762" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="800" y="1565" font-size="12" fill="#1f2933">20. Re-hash the file from transient</text>
<text x="800" y="1581" font-size="12" fill="#1f2933">storage and compare with the</text>
<text x="800" y="1597" font-size="12" fill="#1f2933">registered digest</text>
<rect x="797.0" y="1634" width="216.0" height="35" fill="#ffffff"/>
<line x1="760" y1="1675" x2="1050" y2="1675" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="905.0" y="1647" text-anchor="middle" font-size="12" fill="#1f2933">21. PUT file to the NRS URL with</text>
<text x="905.0" y="1663" text-anchor="middle" font-size="12" fill="#1f2933">Content-Digest</text>
<path d="M1050,1705 H1080 V1775 H1052" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#fa)"/>
<text x="1090" y="1711" font-size="12" fill="#1f2933">22. Verify digest</text>
<text x="1090" y="1727" font-size="12" fill="#1f2933">against checksumSha256</text>
<text x="1090" y="1743" font-size="12" fill="#1f2933">from the attachment</text>
<text x="1090" y="1759" font-size="12" fill="#1f2933">request</text>
<rect x="790.5" y="1796" width="229.0" height="19" fill="#ffffff"/>
<line x1="1050" y1="1821" x2="760" y2="1821" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#oa)"/>
<text x="905.0" y="1809" text-anchor="middle" font-size="12" fill="#1f2933">23. 201 Created (delivered intact)</text>
</svg>