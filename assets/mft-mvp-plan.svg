<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 500" width="1220" height="500" font-family="Arial,Helvetica,sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="34" font-size="17" font-weight="bold" fill="#0b0c0c">Ten working days, 28 September to 9 October 2026</text><text x="40" y="56" font-size="12.5" fill="#505a5f">Configuration is two days. The date is set by connectivity, not by build effort.</text><rect x="40" y="92" width="324" height="20" fill="#f3f2f1" stroke="#b1b4b6" stroke-width="0.8"/><text x="202.0" y="106" font-size="11.5" fill="#505a5f" text-anchor="middle">September 2026</text><rect x="364" y="92" width="756" height="20" fill="#f3f2f1" stroke="#b1b4b6" stroke-width="0.8"/><text x="742.0" y="106" font-size="11.5" fill="#505a5f" text-anchor="middle">October 2026</text><rect x="40" y="114" width="108" height="22" fill="#ffffff" stroke="#b1b4b6" stroke-width="0.8"/><text x="94.0" y="129" font-size="11.5" fill="#0b0c0c" text-anchor="middle">Mon 28</text><text x="94.0" y="82" font-size="9.5" fill="#8f8f94" text-anchor="middle">day 1</text><line x1="40" y1="138" x2="40" y2="468" stroke="#e6e6e8" stroke-width="1"/><rect x="148" y="114" width="108" height="22" fill="#ffffff" stroke="#b1b4b6" stroke-width="0.8"/><text x="202.0" y="129" font-size="11.5" fill="#0b0c0c" text-anchor="middle">Tue 29</text><text x="202.0" y="82" font-size="9.5" fill="#8f8f94" text-anchor="middle">day 2</text><line x1="148" y1="138" x2="148" y2="468" stroke="#e6e6e8" stroke-width="1"/><rect x="256" y="114" width="108" height="22" fill="#ffffff" stroke="#b1b4b6" stroke-width="0.8"/><text x="310.0" y="129" font-size="11.5" fill="#0b0c0c" text-anchor="middle">Wed 30</text><text x="310.0" y="82" font-size="9.5" fill="#8f8f94" text-anchor="middle">day 3</text><line x1="256" y1="138" x2="256" y2="468" stroke="#e6e6e8" stroke-width="1"/><rect x="364" y="114" width="108" height="22" fill="#ffffff" stroke="#b1b4b6" stroke-width="0.8"/><text x="418.0" y="129