 y="114" width="108" height="22" fill="#ffffff" stroke="#b1b4b6" stroke-width="0.8"/><text x="1066.0" y="129" font-size="11.5" fill="#0b0c0c" text-anchor="middle">Fri 9</text><text x="1066.0" y="82" font-size="9.5" fill="#8f8f94" text-anchor="middle">day 10</text><line x1="1012" y1="138" x2="1012" y2="468" stroke="#e6e6e8" stroke-width="1"/><line x1="1120" y1="138" x2="1120" y2="468" stroke="#e6e6e8" stroke-width="1"/><rect x="44" y="148" width="208" height="46" rx="5" ry="5" fill="#fdf3cf" stroke="#a8842a" stroke-width="1.4"/><text x="56" y="175.5" font-size="12.5" fill="#0b0c0c">1. Discovery, endpoint details</text><rect x="44" y="208" width="424" height="46" rx="5" ry="5" fill="#d6e6f5" stroke="#3f6f9f" stroke-width="1.4"/><text x="56" y="235.5" font-size="12.5" fill="#0b0c0c">2. Connectivity, in parallel from day one</text><rect x="476" y="268" width="208" height="46" rx="5" ry="5" fill="#cfe9d8" stroke="#3d7a55" stroke-width="1.4"/><text x="488" y="295.5" font-size="12.5" fill="#0b0c0c">3. Configuration, the only build</text><rect x="692" y="328" width="208" height="46" rx="5" ry="5" fill="#ded3ef" stroke="#6f5a97" stroke-width="1.4"/><text x="704" y="355.5" font-size="12.5" fill="#0b0c0c">4. Testing</text><rect x="908" y="388" width="208" height="46" rx="5" ry="5" fill="#e6d9f2" stroke="#6f5a97" stroke-width="1.4"/><text x="920" y="415.5" font-size="12.5" fill="#0b0c0c">5. Readiness and handover</text><line x1="418.0" y1="138" x2="418.0" y2="442" stroke="#d4351c" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="418.0" cy="442" r="4" fill="#d4351c"/><text x="418.0" y="462" font-size="11" fill="#d4351c" text-anchor="middle">Quarterly cycle runs, capture the real file</text><line x1="1066.0" y1="138" x2="1066.0" y2="442" stroke="#d4351c" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="1066.0" cy="442" r="4" fill="#d4351c"/><text x="1066.0" y="462" font-size="11" fill="#d4351c" text-anchor="end">Go or no-go</text><text x="40" y="484" font-size="11.5" fill="#505a5f">Firewall, allow-list and the ONS endpoint agreement must be raised before day 1. They are the only items that cannot be compressed.</text></svg>