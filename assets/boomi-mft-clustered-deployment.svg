<rect width="1500" height="940" fill="#ffffff"/>
<text x="24" y="44" font-size="25" font-weight="700" fill="#12123A">Boomi MFT clustered deployment with load balancer</text>
<text x="24" y="70" font-size="14" fill="#5b6b7d">The MFT runtime on Boomi MCS calls a load balancer, which distributes across clustered nodes on cloud compute instances, which then connect to the respective HOD endpoint.</text>
<text x="24" y="92" font-size="12.5" fill="#5b6b7d">Solid lines carry the transfer. Dashed lines are supporting or control traffic. Numbered badges follow the request sequence set out below.</text>
<rect x="24" y="116" width="280" height="420" rx="12" fill="#eef4fb" stroke="#cdd8e8" stroke-width="1.4"/>
<text x="38" y="140" font-size="13" font-weight="700" fill="#12123A">Boomi Managed Cloud Services</text>
<text x="38" y="157" font-size="11.2" fill="#5b6b7d">MCS, vendor operated SaaS runtime</text>
<rect x="326" y="116" width="232" height="420" rx="12" fill="#f4f7fb" stroke="#cdd8e8" stroke-width="1.4"/>
<text x="340" y="140" font-size="13" font-weight="700" fill="#12123A">Network edge, trust boundary</text>
<text x="340" y="157" font-size="11.2" fill="#5b6b7d">Egress control, DNS, load balancing</text>
<rect x="580" y="116" width="380" height="420" rx="12" fill="#eef7f1" stroke="#cdd8e8" stroke-width="1.4"/>
<text x="594" y="140" font-size="13" font-weight="700" fill="#12123A">Cloud IaaS, clustered runtime</text>
<text x="594" y="157" font-size="11.2" fill="#5b6b7d">Compute instances hosting the nodes</text>
<rect x="982" y="116" width="494" height="420" rx="12" fill="#fbf5e8" stroke="#cdd8e8" stroke-width="1.4"/>
<text x="996" y="140" font-size="13" font-weight="700" fill="#12123A">Host systems and incumbent estate</text>
<text x="996" y="157" font-size="11.2" fill="#5b6b7d">Destination endpoints reached by the nodes</text>
<rect x="24" y="556" width="1452" height="192" rx="12" fill="#f4f7fb" stroke="#cdd8e8" stroke-width="1.4"/>
<text x="38" y="580" font-size="13" font-weight="700" fill="#12123A">Shared platform services and cluster dependencies</text>
<text x="38" y="597" font-size="11.2" fill="#5b6b7d">Used by every node in the cluster, not held on any single node</text>
<path d="M 286.0 206.0 L 315.0 206.0 L 315.0 200.0 L 344.0 200.0" fill="none" stroke="#2e6ca4" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#ah)"/>
