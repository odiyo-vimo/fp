<text x="230.0" y="157" font-size="13.5" text-anchor="middle" fill="#3e4c59">Flow Studio, admin portal</text>
<text x="230.0" y="177" font-size="13.5" text-anchor="middle" fill="#3e4c59">Intelligrator self-service</text>
<rect x="460" y="90" width="300" height="110" rx="8" fill="#e8f0fa" stroke="#1d4e89" stroke-width="1.8"/>
<text x="610.0" y="131" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Partners and SaaS</text>
<text x="610.0" y="157" font-size="13.5" text-anchor="middle" fill="#3e4c59">SFTP, FTPS, HTTPS, cloud storage</text>
<text x="610.0" y="177" font-size="13.5" text-anchor="middle" fill="#3e4c59">e.g. Pega landing zones</text>
