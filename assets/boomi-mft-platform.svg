<text x="1370.0" y="131" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">External users</text>
<text x="1370.0" y="157" font-size="13.5" text-anchor="middle" fill="#3e4c59">Citizens and stakeholders</text>
<text x="1370.0" y="177" font-size="13.5" text-anchor="middle" fill="#3e4c59">No MFT account needed</text>
