<text x="610.0" y="391" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Automated File Transfer</text>
<text x="610.0" y="417" font-size="13.5" text-anchor="middle" fill="#3e4c59">Organizations, Endpoints, Flows</text>
<text x="610.0" y="437" font-size="13.5" text-anchor="middle" fill="#3e4c59">Schedules, run-now, retries</text>
<text x="610.0" y="457" font-size="13.5" text-anchor="middle" fill="#3e4c59">MFT SFTP, FTPS, HTTPS servers</text>
<rect x="840" y="345" width="300" height="140" rx="8" fill="#ffffff" stroke="#3e4c59" stroke-width="1.8"/>
<text x="990.0" y="391" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Persistent storage</text>
<text x="990.0" y="417" font-size="13.5" text-anchor="middle" fill="#3e4c59">Files held until delivered</text>
<text x="990.0" y="437" font-size="13.5" text-anchor="middle" fill="#3e4c59">Activity, alerts, audit</text>
<text x="990.0" y="457" font-size="13.5" text-anchor="middle" fill="#3e4c59">Encrypted at rest</text>
<rect x="1220" y="345" width="300" height="140" rx="8" fill="#e3f3f1" stroke="#0f6e66" stroke-width="1.8"/>
<text x="1370.0" y="391" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">File Sharing (FS)</text>
<text x="1370.0" y="417" font-size="13.5" text-anchor="middle" fill="#3e4c59">Web app, Dropbox, secure links</text>
<text x="1370.0" y="437" font-size="13.5" text-anchor="middle" fill="#3e4c59">Outlook, Office 365, Salesforce</text>
<text x="1370.0" y="457" font-size="13.5" text-anchor="middle" fill="#3e4c59">Login, expiry, permissions</text>
<rect x="80" y="640" width="300" height="140" rx="8" fill="#ffffff" stroke="#3e4c59" stroke-width="1.8"/>
