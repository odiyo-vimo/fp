<text x="230.0" y="722" font-size="13.5" text-anchor="middle" fill="#3e4c59">Fail closed</text>
<text x="230.0" y="742" font-size="13.5" text-anchor="middle" fill="#3e4c59">Limit about 250 MB (G-15)</text>
