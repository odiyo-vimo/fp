<text x="610.0" y="686" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">MFT Node (Local Node)</text>
<text x="610.0" y="712" font-size="13.5" text-anchor="middle" fill="#3e4c59">Windows or Linux on EC2</text>
<text x="610.0" y="732" font-size="13.5" text-anchor="middle" fill="#3e4c59">Outbound HTTPS only</text>
<text x="610.0" y="752" font-size="13.5" text-anchor="middle" fill="#3e4c59">Serves internal endpoints</text>
<rect x="840" y="640" width="300" height="140" rx="8" fill="#e8f0fa" stroke="#1d4e89" stroke-width="1.8"/>
<text x="990.0" y="686" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Internal endpoints</text>
<text x="990.0" y="712" font-size="13.5" text-anchor="middle" fill="#3e4c59">S3, Azure Blob, Azure Files</text>
<text x="990.0" y="732" font-size="13.5" text-anchor="middle" fill="#3e4c59">File Share (LAN) endpoints</text>
<text x="990.0" y="752" font-size="13.5" text-anchor="middle" fill="#3e4c59">IAM and KMS controlled</text>
<rect x="1220" y="640" width="300" height="140" rx="8" fill="#e3f3f1" stroke="#0f6e66" stroke-width="1.8"/>
<text x="1370.0" y="696" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Staff and agents</text>
<text x="1370.0" y="722" font-size="13.5" text-anchor="middle" fill="#3e4c59">Browser, Outlook add-in</text>
<text x="1370.0" y="742" font-size="13.5" text-anchor="middle" fill="#3e4c59">SMIC dynamic links</text>
<rect x="40" y="835" width="1520" height="76" rx="10" fill="#f7f8fa" stroke="#c5ccd3"/>
<rect x="64" y="853" width="26" height="18" rx="4" fill="#e8f0fa" stroke="#1d4e89" stroke-width="1.8"/>
<text x="100" y="867" font-size="14" fill="#1f2933">Automated File Transfer (system to system)</text>
<rect x="455.64000000000004" y="853" width="26" height="18" rx="4" fill="#e3f3f1" stroke="#0f6e66" stroke-width="1.8"/>
<text x="491.64000000000004" y="867" font-size="14" fill="#1f2933">File Sharing (person to person)</text>
<rect x="765.6600000000001" y="853" width="26" height="18" rx="4" fill="#ffffff" stroke="#3e4c59" stroke-width="1.8"/>
<text x="801.6600000000001" y="867" font-size="14" fill="#1f2933">Shared platform service or external party</text>
<text x="64" y="895" font-size="13" fill="#52606d">Arrows show data flow. The MFT Node opens every connection to the Cloud, so no inbound port is opened to the internal network. AFT and FS share one tenant, storage and audit trail.</text>
